<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امتحان صموئيل الأول – الإصحاح السادس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fbf3e2; --surface:#fffdf7; --ink:#2f1a1f; --muted:#6f5a52; --maroon:#7a1f2b; --gold:#c4952e; --mix:white;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#1b0e11; --surface:#291619; --ink:#f5e9d2; --muted:#cdb89d; --maroon:#d1697a; --gold:#e3b855; --mix:#291619;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
header{text-align:center;padding:14px 8px 8px}
h1{font-family:"Amiri","Cairo",serif;font-size:clamp(26px,7vw,38px);margin:0;color:var(--maroon);line-height:1.3}
header p{margin:4px 0 0;color:var(--muted)}
.box{background:var(--surface);border:3px solid var(--gold);border-radius:18px;padding:20px 16px;margin-top:16px;text-align:center}
.box label{display:block;font-weight:800;margin-bottom:8px;font-size:18px}
.box input{width:100%;padding:12px 14px;font:inherit;font-size:18px;border-radius:12px;border:2px solid var(--gold);background:var(--bg);color:var(--ink);text-align:center}
.box input:focus-visible{outline:3px solid var(--maroon)}
.btn{display:inline-block;margin-top:14px;padding:12px 30px;border-radius:99px;border:0;background:var(--maroon);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wa{background:#1f9d55}
.btn.alt{background:transparent;color:var(--maroon);border:2px solid var(--maroon)}
.note{color:var(--muted);margin:10px 0 0;font-size:15px}
.warn{color:#b3261e;font-weight:800;margin-top:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px}
.track{height:12px;border-radius:99px;background:color-mix(in srgb,var(--gold) 25%,var(--mix));overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#e8553d,#f2b134,#2fa866,#2f7fd1,#8a4fc7);transition:width .3s}
.score{display:flex;justify-content:space-between;font-weight:800;margin-top:6px}
.card{--c:#e8553d;background:var(--surface);border:2px solid var(--c);border-radius:16px;margin:14px 0;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:19px;line-height:1.6;color:#fff;background:var(--c);display:flex;gap:10px;align-items:flex-start}
.card h2 span.n{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:#2f1a1f;display:grid;place-items:center;font-weight:800}
.opts{padding:10px;display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:2px solid color-mix(in srgb,var(--c) 45%,var(--mix));background:color-mix(in srgb,var(--c) 10%,var(--mix));font-size:17px;font-weight:600;-webkit-tap-highlight-color:transparent}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .mark{margin-inline-start:auto;font-weight:800}
.opt.sel{background:var(--c);border-color:var(--c);color:#fff}
.big{font-family:"Amiri","Cairo",serif;font-size:46px;color:var(--maroon);line-height:1.2}
.stars{font-size:32px;letter-spacing:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>امتحان صموئيل الأول – الإصحاح السادس</h1>
    <p>8 أسئلة. اختر إجابة لكل سؤال ثم أنهِ الامتحان لتعرف درجتك.</p>
  </header>

  <section class="box" id="startBox">
    <label for="nm">اكتب اسمك الثلاثي</label>
    <input id="nm" type="text" autocomplete="name" maxlength="60">
    <div class="warn hide" id="nmWarn">من فضلك اكتب اسمك أولًا.</div>
    <button class="btn" id="go" type="button">ابدأ الامتحان</button>
    <p class="note" id="startNote"></p>
  </section>

  <div class="bar hide" id="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="score"><span id="prog">تمت الإجابة على 0 من 8</span></div>
  </div>
  <main id="qs"></main>
  <div style="text-align:center" class="hide" id="finWrap">
    <div class="warn hide" id="finWarn">أجب على كل الأسئلة أولًا.</div>
    <button class="btn" id="fin" type="button">إنهاء الامتحان</button>
  </div>

  <section class="box hide" id="res" aria-live="polite">
    <div class="stars" id="stars"></div>
    <div class="big" id="final"></div>
    <p id="msg"></p>
    <a class="btn wa hide" id="wa" target="_blank" rel="noopener">إرسال النتيجة على واتساب</a>
    <p class="note hide" id="waNote">اضغط الزر ثم اضغط إرسال في الواتساب حتى تصل نتيجتك.</p>
    <br>
    <button class="btn alt hide" id="again" type="button">إعادة المحاولة</button>
    <p class="note" id="left"></p>
  </section>
</div>

<script>
var PHONE="201211970083", MAX=2, KEY="samuel6_exam_v1";
var Q=[
 ["كم شهرًا بقي تابوت الرب في بلاد الفلسطينيين؟",["ثلاثة أشهر","سبعة أشهر","عشرة أشهر","أربعين يومًا"],1,"#e8553d"],
 ["من استشار الفلسطينيون ليعرفوا ماذا يفعلون بالتابوت؟",["الأنبياء","الملك والقضاة","الكهنة والعرّافين","شيوخ بني إسرائيل"],2,"#2f7fd1"],
 ["ماذا أرسلوا مع التابوت كذبيحة إثم؟",["ذهب وفضة وحجارة كريمة","خمسة أورام وخمسة فئران من ذهب","ثيرانًا وكباشًا","خبزًا وخمرًا"],1,"#2fa866"],
 ["من جرّ العجلة الجديدة التي عليها التابوت؟",["ثوران قويان","حماران","جملان","بقرتان مرضعتان لم يعلُ عليهما نير"],3,"#8a4fc7"],
 ["ما العلامة التي أثبتت أن الضربة من الرب؟",["رجعت البقرتان إلى بيتهما","ذهبت البقرتان مباشرة في طريق بيت شمس","وقفت البقرتان في الطريق","ركضت البقرتان في كل اتجاه"],1,"#e08a00"],
 ["ماذا فعل أهل بيت شمس عندما رأوا التابوت؟",["هربوا خوفًا","تجاهلوه","فرحوا وكانوا يحصدون الحنطة","أخفوه في بيت"],2,"#d6336c"],
 ["ماذا حدث لمن نظروا إلى داخل التابوت؟",["باركهم الرب","ضرب الرب منهم عددًا كبيرًا","لم يحدث شيء","صاروا كهنة"],1,"#0e9aa7"],
 ["إلى أين أرسل أهل بيت شمس التابوت؟",["أورشليم","شيلوه","بيت إيل","قرية يعاريم"],3,"#7a1f2b"]
];

function $(id){return document.getElementById(id);}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function show(id,on){$(id).classList.toggle("hide",!on);}
function ld(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function sv(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
var st=ld(), chosen=[], order=[];

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function init(){
  var used=st.n||0;
  if(st.name)$("nm").value=st.name;
  if(used>=MAX){ showResult(true); show("startBox",false); return; }
  var note="لديك "+(MAX-used)+" من "+MAX+" محاولات.";
  if(typeof st.last==="number")note+=" آخر درجة لك: "+st.last+" من "+Q.length+".";
  $("startNote").textContent=note;
}

function startExam(){
  var name=$("nm").value.trim();
  if(name.length<2){show("nmWarn",true);return;}
  show("nmWarn",false);
  st.n=(st.n||0)+1; st.name=name; st.done=false; sv();
  show("startBox",false); show("res",false);
  buildQuiz();
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildQuiz(){
  var qs=$("qs"); qs.textContent="";
  chosen=[]; order=[];
  Q.forEach(function(q,i){
    chosen.push(-1);
    var idx=shuffle([0,1,2,3]); order.push(idx);
    var card=el("div","card"); card.style.setProperty("--c",q[3]);
    var h=el("h2"); h.appendChild(el("span","n",String(i+1))); h.appendChild(el("span","",q[0]));
    var box=el("div","opts");
    idx.forEach(function(orig,pos){
      var b=el("button","opt"); b.type="button";
      b.appendChild(el("span","",q[1][orig]));
      b.appendChild(el("span","mark",""));
      b.addEventListener("click",function(){
        chosen[i]=pos;
        var all=box.querySelectorAll(".opt");
        for(var k=0;k<all.length;k++){all[k].classList.remove("sel");all[k].lastChild.textContent="";}
        b.classList.add("sel"); b.lastChild.textContent="●";
        updProg();
      });
      box.appendChild(b);
    });
    card.appendChild(h); card.appendChild(box); qs.appendChild(card);
  });
  show("bar",true); show("finWrap",true); show("finWarn",false); updProg();
}

function answeredCount(){return chosen.filter(function(c){return c>=0;}).length;}
function updProg(){
  var a=answeredCount();
  $("prog").textContent="تمت الإجابة على "+a+" من "+Q.length;
  $("fill").style.width=(a/Q.length*100)+"%";
  if(a===Q.length)show("finWarn",false);
}

function finishExam(){
  if(answeredCount()<Q.length){show("finWarn",true);return;}
  var s=0;
  Q.forEach(function(q,i){ if(order[i][chosen[i]]===q[2])s++; });
  st.last=s; st.done=true; sv();
  show("bar",false); show("finWrap",false); $("qs").textContent="";
  showResult(false);
  window.scrollTo({top:0,behavior:"smooth"});
}

function showResult(locked){
  show("res",true);
  var used=st.n||0, hasScore=(typeof st.last==="number");
  if(hasScore){
    var s=st.last, stars=s>=7?5:s>=5?4:s>=3?3:2;
    $("stars").textContent="★".repeat(stars)+"☆".repeat(5-stars);
    $("final").textContent="درجتك: "+s+" من "+Q.length;
    $("msg").textContent=s>=7?"ممتاز! أنت حافظ القصة جيدًا.":s>=5?"جيد جدًا! استمر.":"حاول مرة أخرى بعد قراءة الإصحاح.";
    var text="نتيجة امتحان صموئيل الأول – الإصحاح السادس\nالاسم: "+(st.name||"")+"\nالدرجة: "+s+" من "+Q.length+"\nالمحاولة: "+used;
    $("wa").href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(text);
    show("wa",true); show("waNote",true);
  } else {
    $("stars").textContent=""; $("final").textContent="";
    $("msg").textContent="انتهت محاولاتك في هذا الامتحان.";
  }
  var remaining=MAX-used;
  if(!locked && remaining>0){
    show("again",true);
    $("left").textContent="باقي لك "+remaining+" محاولة.";
  } else {
    show("again",false);
    $("left").textContent="لا توجد محاولات متبقية.";
  }
}

$("go").addEventListener("click",startExam);
$("fin").addEventListener("click",finishExam);
$("again").addEventListener("click",function(){
  st.n=(st.n||0)+1; st.done=false; sv();
  show("res",false); buildQuiz(); window.scrollTo({top:0,behavior:"smooth"});
});
init();
</script>
</body>
</html>
