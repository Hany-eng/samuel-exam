<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امتحان صموئيل الأول – الإصحاح السادس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fbf3e2; --surface:#fffdf7; --ink:#2f1a1f; --muted:#6f5a52; --maroon:#7a1f2b; --gold:#c4952e;
  --ok:#1f7a3a; --okbg:#d9f0de; --no:#b3261e; --nobg:#fadcd8; --mix:white;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1b0e11; --surface:#291619; --ink:#f5e9d2; --muted:#cdb89d; --maroon:#d1697a; --gold:#e3b855;
    --ok:#7fdc97; --okbg:#1d3a25; --no:#ff9a91; --nobg:#46201d; --mix:#291619;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
header{text-align:center;padding:14px 8px 8px}
h1{font-family:"Amiri","Cairo",serif;font-size:clamp(26px,7vw,38px);margin:0;color:var(--maroon);line-height:1.3}
header p{margin:4px 0 0;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px}
.track{height:12px;border-radius:99px;background:color-mix(in srgb,var(--gold) 25%,var(--mix));overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#e8553d,#f2b134,#2fa866,#2f7fd1,#8a4fc7);transition:width .3s}
.score{display:flex;justify-content:space-between;font-weight:800;margin-top:6px}
.card{--c:#e8553d;background:var(--surface);border:2px solid var(--c);border-radius:16px;margin:14px 0;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:19px;line-height:1.6;color:#fff;background:var(--c);display:flex;gap:10px;align-items:flex-start}
.card h2 span.n{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:#2f1a1f;display:grid;place-items:center;font-weight:800}
.opts{padding:10px;display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:2px solid color-mix(in srgb,var(--c) 45%,var(--mix));background:color-mix(in srgb,var(--c) 10%,var(--mix));font-size:17px;font-weight:600;-webkit-tap-highlight-color:transparent}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .mark{margin-inline-start:auto;font-weight:800}
.card.done .opt{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.fb{padding:0 14px 12px;font-weight:600;min-height:0}
.res{display:none;text-align:center;padding:22px 16px;border-radius:18px;border:3px solid var(--gold);background:var(--surface);margin-top:18px}
.res.show{display:block}
.res .big{font-family:"Amiri","Cairo",serif;font-size:44px;color:var(--maroon);line-height:1.2}
.res .stars{font-size:32px;letter-spacing:4px}
.btn{margin-top:12px;padding:11px 28px;border-radius:99px;border:0;background:var(--maroon);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>امتحان صموئيل الأول – الإصحاح السادس</h1>
    <p>اختر الإجابة الصحيحة. تظهر النتيجة فور الاختيار.</p>
  </header>
  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="score"><span id="prog">0 / 8 أُجيب</span><span id="pts">الدرجة: 0</span></div>
  </div>
  <main id="qs"></main>
  <section class="res" id="res" aria-live="polite">
    <div class="stars" id="stars"></div>
    <div class="big" id="final"></div>
    <p id="msg"></p>
    <button class="btn" id="again" type="button">إعادة الامتحان</button>
  </section>
</div>
<script>
var Q=[
 ["كم شهرًا بقي تابوت الرب في بلاد الفلسطينيين؟",["ثلاثة أشهر","سبعة أشهر","عشرة أشهر","أربعين يومًا"],1,"#e8553d"],
 ["من استشار الفلسطينيون ليعرفوا ماذا يفعلون بالتابوت؟",["الأنبياء","الملك والقضاة","الكهنة والعرّافين","شيوخ بني إسرائيل"],2,"#2f7fd1"],
 ["ماذا أرسلوا مع التابوت كذبيحة إثم؟",["ذهب وفضة وحجارة كريمة","خمسة أورام وخمسة فئران من ذهب","ثيرانًا وكباشًا","خبزًا وخمرًا"],1,"#2fa866"],
 ["من جرّ العجلة الجديدة التي عليها التابوت؟",["ثوران قويان","حماران","جملان","بقرتان مرضعتان لم يعلُ عليهما نير"],3,"#8a4fc7"],
 ["ما العلامة التي أثبتت أن الضربة من الرب؟",["رجعت البقرتان إلى بيتهما","ذهبت البقرتان مباشرة في طريق بيت شمس","وقفت البقرتان في الطريق","ركضت البقرتان في كل اتجاه"],1,"#e08a00"],
 ["ماذا فعل أهل بيت شمس عندما رأوا التابوت؟",["هربوا خوفًا","تجاهلوه","فرحوا وكانوا يحصدون الحنطة","أخفوه في بيت"],2,"#d6336c"],
 ["ماذا حدث لمن نظروا إلى داخل التابوت؟",["باركهم الرب","ضرب الرب منهم عددًا كبيرًا","لم يحدث شيء","صاروا كهنة"],1,"#0e9aa7"],
 ["إلى أين أرسل أهل بيت شمس التابوت؟",["أورشليم","شيلوه","بيت إيل","قرية يعاريم"],3,"#7a1f2b"]
];
var qs=document.getElementById("qs"),score=0,answered=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function build(){
  qs.textContent="";score=0;answered=0;upd();document.getElementById("res").className="res";
  Q.forEach(function(q,i){
    var card=el("div","card");card.style.setProperty("--c",q[3]);
    var h=el("h2");h.appendChild(el("span","n",String(i+1)));h.appendChild(el("span","",q[0]));
    var box=el("div","opts"),fb=el("div","fb");
    q[1].forEach(function(t,j){
      var b=el("button","opt");b.type="button";b.appendChild(el("span","",t));var m=el("span","mark","");b.appendChild(m);
      b.addEventListener("click",function(){
        if(card.classList.contains("done"))return;
        card.classList.add("done");answered++;
        var all=box.querySelectorAll(".opt");
        all[q[2]].classList.add("ok");all[q[2]].lastChild.textContent="✓";
        if(j===q[2]){score++;fb.textContent="أحسنت! إجابة صحيحة.";fb.style.color="var(--ok)";}
        else{b.classList.add("no");m.textContent="✗";fb.textContent="الإجابة الصحيحة: "+q[1][q[2]];fb.style.color="var(--no)";}
        upd();if(answered===Q.length)finish();
      });
      box.appendChild(b);
    });
    card.appendChild(h);card.appendChild(box);card.appendChild(fb);qs.appendChild(card);
  });
}
function upd(){
  document.getElementById("prog").textContent=answered+" / "+Q.length+" أُجيب";
  document.getElementById("pts").textContent="الدرجة: "+score;
  document.getElementById("fill").style.width=(answered/Q.length*100)+"%";
}
function finish(){
  var r=document.getElementById("res");r.className="res show";
  document.getElementById("final").textContent=score+" من "+Q.length;
  var s=score>=7?5:score>=5?4:score>=3?3:2;
  document.getElementById("stars").textContent="★".repeat(s)+"☆".repeat(5-s);
  document.getElementById("msg").textContent=score>=7?"ممتاز! أنت حافظ القصة جيدًا.":score>=5?"جيد جدًا! راجع الأسئلة التي أخطأت فيها.":"حاول مرة أخرى بعد قراءة الإصحاح.";
  r.scrollIntoView({behavior:"smooth",block:"center"});
}
document.getElementById("again").addEventListener("click",function(){build();window.scrollTo({top:0,behavior:"smooth"});});
build();
</script>
</body>
</html>
